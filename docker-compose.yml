services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geo_platform
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env设置仅用于此数据库的强密码}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - geo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo_platform"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  geo_postgres_data:
